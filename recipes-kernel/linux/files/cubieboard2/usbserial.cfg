CONFIG_USB_SERIAL=m
# OpenVario primarily uses onboard UARTs. For USB adapters keep only the
# common RS232 bridge families plus the generic/simple fallbacks that cover
# many ttyUSB0 devices. The removed drivers are mostly legacy PDA/phone,
# industrial, barcode, payment-terminal and WWAN modem adapters that are not
# part of the supported OpenVario hardware set and add measurable image size.
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_SIMPLE=m
CONFIG_USB_SERIAL_CH341=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_PL2303=m
# CONFIG_USB_SERIAL_DEBUG is not set

# ttyACM* devices are also common enough to keep.
CONFIG_USB_ACM=m
