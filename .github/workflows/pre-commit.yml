name: Pre-commit

"on":
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pre-commit==4.7.0
      # shortcut: lint the diff only. Existing scripts still fail shellcheck;
      # switch to `pre-commit run --all-files` once they are clean.
      - run: pre-commit run --show-diff-on-failure --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}
